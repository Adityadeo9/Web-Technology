
<!DOCTYPE html>
<html>
<head>
<title>Leap Year</title>
</head>
<body>

<h2>Leap Year Checker</h2>

<input type="number" id="year" placeholder="Enter year">
<button onclick="checkYear()">Check</button>

<p id="result"></p>

<script>
function checkYear() {
    let y = Number(document.getElementById("year").value);

    if (y <= 0 || !Number.isInteger(y)) {
        document.getElementById("result").innerHTML =
            "Enter a valid year";
        return;
    }

    if ((y % 400 == 0) ||
        (y % 4 == 0 && y % 100 != 0)) {

        document.getElementById("result").innerHTML =
            "Leap Year";
    } else {
        document.getElementById("result").innerHTML =
            "Not a Leap Year";
    }
}
</script>

</body>
</html>
