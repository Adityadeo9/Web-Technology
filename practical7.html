<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h2>Student Registration</h2>

    <form>
        Name:
        <input type="text" required>
        <br><br>

        Email:
        <input type="email" required>
        <br><br>

        Phone:
        <input type="tel">
        <br><br>

        Date of Birth:
        <input type="date">
        <br><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
