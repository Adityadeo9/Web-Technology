
<!DOCTYPE html>
<html>
<head>
<title>Button Effects</title>
<style>
button {
    background: blue;
    color: white;
    padding: 15px 25px;
    border: none;
    border-radius: 8px;
}

button:hover {
    background: green;
}

button:focus {
    outline: 3px solid orange;
}

button:active {
    background: red;
}
</style>
</head>
<body>

<h2>Button Example</h2>
<button>Click Me</button>

</body>
</html>
