
<!DOCTYPE html>
<html>
<head>
<title>Vowel Counter</title>
</head>
<body>

<h2>Count Vowels</h2>

<input type="text" id="text" placeholder="Enter a string">
<button onclick="countVowels()">Count</button>

<p id="result"></p>

<script>
function countVowels() {
    let str = document.getElementById("text").value.toLowerCase();
    let count = 0;

    for (let i = 0; i < str.length; i++) {
        if ("aeiou".includes(str[i])) {
            count++;
        }
    }

    document.getElementById("result").innerHTML =
        "Number of vowels = " + count;
}
</script>

</body>
</html>
