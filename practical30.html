
<!DOCTYPE html>
<html>
<head>
<title>Digital Clock</title>
<style>
body {
    text-align: center;
    font-family: Arial;
}

#clock {
    font-size: 40px;
    color: blue;
}
</style>
</head>
<body>

<h2>Digital Clock</h2>

<div id="clock"></div>

<script>
function showTime() {
    let time = new Date();

    let hours = time.getHours();
    let minutes = time.getMinutes();
    let seconds = time.getSeconds();

    document.getElementById("clock").innerHTML =
        hours + ":" + minutes + ":" + seconds;
}

showTime();
setInterval(showTime, 1000);
</script>

</body>
</html>
