
<!DOCTYPE html>
<html>
<head>
<title>Image Gallery</title>
<style>
img {
    cursor: pointer;
    margin: 10px;
}
</style>
</head>
<body>

<h2>Image Gallery</h2>

<img src="https://placehold.co/100x70?text=Image+1"
     onclick="showImage(this.src)">

<img src="https://placehold.co/100x70?text=Image+2"
     onclick="showImage(this.src)">

<img src="https://placehold.co/100x70?text=Image+3"
     onclick="showImage(this.src)">

<br><br>

<img id="large"
     src="https://placehold.co/400x250?text=Select+Image"
     width="400">

<script>
function showImage(source) {
    document.getElementById("large").src = source;
}
</script>

</body>
</html>
