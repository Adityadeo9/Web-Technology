
<!DOCTYPE html>
<html>
<head>
<title>Pricing Plans</title>
<style>
.container {
    display: flex;
    gap: 15px;
    text-align: center;
}

.plan {
    border: 2px solid blue;
    padding: 20px;
    flex: 1;
    border-radius: 10px;
}

button {
    background: blue;
    color: white;
    padding: 10px;
}
</style>
</head>
<body>

<h2>Our Pricing Plans</h2>

<div class="container">

    <div class="plan">
        <h3>Basic</h3>
        <h2>₹99</h2>
        <p>1 User</p>
        <button>Choose</button>
    </div>

    <div class="plan">
        <h3>Standard</h3>
        <h2>₹199</h2>
        <p>5 Users</p>
        <button>Choose</button>
    </div>

    <div class="plan">
        <h3>Premium</h3>
        <h2>₹299</h2>
        <p>Unlimited Users</p>
        <button>Choose</button>
    </div>

</div>

</body>
</html>
